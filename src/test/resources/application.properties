# Aula 5: os testes usam H2 em memoria, nao o modo servidor da aplicacao.
# Motivo: o servidor TCP (porta 9092) so sobe dentro de MvcAula2Application.main(),
# que os testes nao executam - manter jdbc:h2:tcp:// aqui derrubaria os testes.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
