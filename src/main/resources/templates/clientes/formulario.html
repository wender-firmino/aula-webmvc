<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Cliente')}"></head>
<body>
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container my-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header"
             th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'">Dados do cliente</div>
        <div class="card-body">
          <form th:action="@{/paginas/clientes}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
              <label class="form-label" for="nome">Nome</label>
              <input class="form-control" id="nome" th:field="*{nome}" required/>
            </div>

            <div class="mb-3">
              <label class="form-label" for="email">E-mail</label>
              <input type="email" id="email" class="form-control"
                     th:field="*{email}"
                     th:classappend="${erro != null} ? 'is-invalid'" required/>
              <!-- invalid-feedback precisa vir logo depois do input -->
              <div class="invalid-feedback" th:text="${erro}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Salvar</button>
            <a class="btn btn-link" th:href="@{/paginas/clientes}">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
