<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3">Clientes</h1>
    <a class="btn btn-primary" th:href="@{/paginas/clientes/novo}">Novo cliente</a>
  </div>

  <!-- Mensagem de sucesso: chega por flash attribute e aparece uma unica vez -->
  <div th:if="${sucesso != null}"
       class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${sucesso}">Mensagem</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"
            aria-label="Fechar"></button>
  </div>

  <div th:if="${#lists.isEmpty(clientes)}" class="alert alert-info">
    Nenhum cliente cadastrado.
  </div>

  <div class="table-responsive" th:unless="${#lists.isEmpty(clientes)}">
    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr>
          <th>Nome</th>
          <th class="d-none d-md-table-cell">E-mail</th>
          <th class="text-end">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${clientes}">
          <td th:text="${c.nome}">Nome</td>
          <td class="d-none d-md-table-cell" th:text="${c.email}">email</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary"
               th:href="@{|/paginas/clientes/editar/${c.id}|}">Editar</a>
            <form class="d-inline" method="post"
                  th:action="@{|/paginas/clientes/excluir/${c.id}|}"
                  onsubmit="return confirm('Excluir este cliente?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">
                Excluir</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
