<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' - mvc-aula2'">mvc-aula2</title>
  <!-- Aula 10 (4.3): Bootstrap 5.3.8 via CDN. Alternativa sem internet: WebJar (ver README) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous" defer></script>
</head>
<body>
  <!-- Escrito uma vez, incluido em varias paginas com th:replace -->
  <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-primary"
       data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" th:href="@{/paginas/clientes}">mvc-aula2</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false"
              aria-label="Alternar menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/paginas/clientes}">Clientes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/paginas/clientes/novo}">Novo cliente</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</body>
</html>
