# Nome da aplicacao (aparece no log de inicializacao)
spring.application.name=mvc-aula2

# Porta em que a aplicacao vai rodar
server.port=8080

# Banco de dados H2 em memoria (sem instalacao)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, disponivel em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Aula 3: cria/atualiza as tabelas automaticamente a partir das entidades JPA (@Entity)
spring.jpa.hibernate.ddl-auto=update
# Mostra no log o SQL que o Hibernate gera - util para entender o que cada anotacao faz
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nivel de detalhe do log
logging.level.root=INFO
