# Nome da aplicacao (aparece no log de inicializacao)
spring.application.name=mvc-aula2

# Porta em que a aplicacao vai rodar
server.port=8080

# Aula 5 (2.3): H2 em modo servidor, nao mais em memoria.
# Antes: jdbc:h2:mem:testdb - banco morria junto com o processo da aplicacao.
# Agora: jdbc:h2:tcp://... - o banco vira um processo proprio (porta 9092),
# com os dados gravados no arquivo ./data/mvcdb.mv.db, sobrevivendo a reinicios.
spring.datasource.url=jdbc:h2:tcp://localhost:9092/./data/mvcdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, disponivel em http://localhost:8080/h2-console
spring.h2.console.enabled=true
# Permite que o H2 Console (rodando dentro da aplicacao) acesse o servidor TCP externo
spring.h2.console.settings.web-allow-others=true

# Aula 3: cria/atualiza as tabelas automaticamente a partir das entidades JPA (@Entity)
spring.jpa.hibernate.ddl-auto=update
# Mostra no log o SQL que o Hibernate gera - util para entender o que cada anotacao faz
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nivel de detalhe do log
logging.level.root=INFO
